name: Build mobile apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - name: Build bundled Android game
        run: npm run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: snowball-quest-android-debug
          path: releases/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build iOS simulator app without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: tar -czf snowball-quest-ios-simulator.tar.gz -C build/ios-simulator/Build/Products/Debug-iphonesimulator App.app
      - uses: actions/upload-artifact@v4
        with:
          name: snowball-quest-ios-simulator
          path: snowball-quest-ios-simulator.tar.gz
          if-no-files-found: error
