name: Test native Swift iOS

on:
  push:
    branches: [feature/native-swift-ios]
    paths: ['ios/**', 'scripts/**', 'tests/test_*.py', '.github/workflows/ios-native.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Test release helpers
        run: |
          python3 -m pip install cryptography==50.0.1
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test native Swift game on iPhone simulator
        timeout-minutes: 20
        run: bash scripts/check-native-ios.sh
      - name: Validate unsigned native iPhone archive
        run: python3 scripts/ios-release.py --mode check --build-number 4
      - name: Save test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snowball-native-tests
          path: test-results/native-ios
          retention-days: 7
          if-no-files-found: warn
