name: Prepare or upload iOS release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = unsigned device archive; archive = signed IPA; testflight = upload IPA to Apple'
        type: choice
        options: [check, archive, testflight]
        default: check
        required: true
      build_number:
        description: 'Unique iOS build number, 1 through 9999; increment after each accepted upload'
        type: string
        default: '4'
        required: true

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/native-swift-ios'
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
      - name: Detect native iOS project
        id: engine
        run: |
          python3 -c 'import os, plistlib; p=plistlib.load(open("ios/App/App/Info.plist", "rb")); open(os.environ["GITHUB_OUTPUT"], "a").write("native=" + str(p.get("SnowballEngine") == "SpriteKit").lower() + "\n")'
      - uses: actions/setup-node@v6
        if: steps.engine.outputs.native != 'true'
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Apple status helper dependency
        run: python3 -m pip install cryptography==50.0.1
      - name: Validate release inputs and helper
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -c 'import os, runpy; runpy.run_path("scripts/ios-release.py")["build_number"](os.environ["BUILD_NUMBER"])'
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Test native Swift game on iPhone simulator
        if: steps.engine.outputs.native == 'true'
        timeout-minutes: 20
        run: bash scripts/check-native-ios.sh
      - name: Prepare legacy Capacitor game
        if: steps.engine.outputs.native != 'true'
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync ios
      - name: Check unsigned device archive
        if: inputs.mode == 'check'
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 scripts/ios-release.py --mode check --build-number "$BUILD_NUMBER"
      - name: Export signed IPA or upload to TestFlight
        if: inputs.mode != 'check'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/ios-release.py --mode "$RELEASE_MODE" --build-number "$BUILD_NUMBER"
      - name: Confirm TestFlight internal availability
        if: inputs.mode == 'testflight' && steps.engine.outputs.native == 'true'
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/testflight-status.py --build-number "$BUILD_NUMBER"
      - name: Save signed IPA, checksum and Apple status
        if: always() && inputs.mode != 'check' && hashFiles('releases/ios/snowball-quest.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: snowball-quest-ios-build-${{ inputs.build_number }}
          path: |
            releases/ios/snowball-quest.ipa
            releases/ios/SHA256SUMS.txt
            releases/ios/testflight-status.json
          retention-days: 7
          if-no-files-found: error
      - name: Save native test results and screenshots
        if: always() && steps.engine.outputs.native == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snowball-native-tests-build-${{ inputs.build_number }}
          path: test-results/native-ios
          retention-days: 7
          if-no-files-found: warn
